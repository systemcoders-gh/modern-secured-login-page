{% if form.errors %}
<div class="error-summary" role="alert" tabindex="-1"><strong>Please check your details.</strong>
  {% if form.non_field_errors %}{{ form.non_field_errors }}{% endif %}
  <ul>{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}</ul>
</div>
{% endif %}
