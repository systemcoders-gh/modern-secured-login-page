version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Framework upgrades are architectural changes; keep reviewed release lines.
    ignore:
      - dependency-name: Django
        versions: [">=5.3"]
      - dependency-name: django-allauth
        versions: [">=66"]
    groups:
      python-maintenance:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
